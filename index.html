<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Numan Calculator - A simple and fast online calculator built by Numan.">
<meta name="keywords" content="numan calculator, numan project, calculator online, simple calculator">
<meta name="author" content="Numan">
    <link rel="stylesheet" href="index.css">
    <title>calculator - by numan-codes</title>
</head>
<body>
    <div class="container">
        <div class="calculator">
        <input type="text" placeholder="0" id="result">
        <div>
            <button onclick="clrs()">AC</button>
            <button onclick="dle()">DEL</button>
            <button onclick="display('%')">%</button>
            <button onclick="display('÷')">÷</button>
            
        </div>
        <div>
            <button onclick="display('7')">7</button>
            <button onclick="display('8')">8</button>
            <button onclick="display('9')">9</button>
            <button onclick="display('x')">x</button>
            
        </div>
        <div>
            <button onclick="display('4')">4</button>
            <button onclick="display('5')">5</button>
            <button onclick="display('6')">6</button>
            <button onclick="display('-')">-</button>
            
        </div>
        <div>
            <button onclick="display('1')">1</button>
            <button onclick="display('2')">2</button>
            <button onclick="display('3')">3</button>
            <button onclick="display('+')">+</button>
            
        </div>
         <div>
            <button onclick="display('.')">.</button>
            <button onclick="display('0')">0</button>
            <button class="equal" onclick="calculate()">=</button>
            
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
